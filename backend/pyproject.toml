[project]
name = "portfolio-app-backend"
version = "0.1.0"
description = "Personal portfolio backend with Supabase, stable asset IDs, importers, and snapshots."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "supabase>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
