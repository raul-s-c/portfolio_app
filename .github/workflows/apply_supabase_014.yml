name: Apply Supabase migration 014

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply_supabase_014.yml"
      - "supabase/migrations/014_service_role_virtual_portfolio_grants.sql"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: nasuybwjddcrrmekcslu
      MIGRATION_FILE: supabase/migrations/014_service_role_virtual_portfolio_grants.sql
    steps:
      - uses: actions/checkout@v4

      - name: Check required inputs
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -f "$MIGRATION_FILE" || (echo "Missing migration file $MIGRATION_FILE" && exit 1)

      - name: Apply migration 014 through Supabase Management API
        shell: bash
        run: |
          jq -n --rawfile query "$MIGRATION_FILE" '{query: $query, read_only: false}' > /tmp/apply-014.json
          curl --fail-with-body \
            --request POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/apply-014.json

      - name: Validate migration 014
        shell: bash
        run: |
          jq -n \
            --arg query "select has_table_privilege('service_role', 'public.virtual_portfolio_assignments', 'select') as service_can_read_assignments;" \
            '{query: $query, read_only: true}' > /tmp/validate-014.json
          curl --fail-with-body \
            --request POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/validate-014.json
